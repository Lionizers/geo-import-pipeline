[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-import-pipeline"
version = "0.1.0"
description = "Automated geodata import (WFS/CSV -> PostgreSQL/PostGIS) for the MOSIDI platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pyproj>=3.6",
  "shapely>=2.0",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "croniter>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipeline = ["meta_schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
